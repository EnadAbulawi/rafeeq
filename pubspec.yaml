name: rafeeq
description: Offline Arabic dhikr and Quran companion.
publish_to: none
version: 1.0.1+2
environment:
  sdk: ^3.13.2
dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: 5.1.1
  just_audio: 0.10.6
  qcf_quran_plus: 0.1.1
  sqflite: ^2.4.2
  timezone: 0.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/IBM-Plex-OFL.txt
    - assets/fonts/Amiri-OFL.txt
  fonts:
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
